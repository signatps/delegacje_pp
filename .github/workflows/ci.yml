name: CI

on:
  push:
    branches: ["main", "master", "cursor/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend:
    name: Testy i build frontendu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

  test-rust:
    name: Testy Rust (diety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src-tauri/crates/calculations/Cargo.toml

  # Linux i macOS Intel celowo wyłączone — oszczędność minut Actions.
  # Przywróć osobnymi jobami dopiero przy dystrybucji produkcyjnej.
  build-tauri:
    name: Build Tauri (${{ matrix.name }})
    needs: [test-frontend, test-rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: aarch64-apple-darwin
          - name: windows
            platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # Niepodpisany .app z Safari/GitHub dostaje kwarantannę Gatekeeper → komunikat „uszkodzona”.
      # Ad-hoc codesign + ZIP ułatwia lokalne testy; produkcja wymaga Apple Developer ID + notaryzacji.
      - name: Ad-hoc sign macOS app and pack ZIP
        if: matrix.name == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target -type d -name "Delegacje PP.app" | head -n 1)
          if [[ -z "${APP}" ]]; then
            echo "Nie znaleziono Delegacje PP.app"
            find src-tauri/target -path '*bundle*' -maxdepth 6 -print || true
            exit 1
          fi
          echo "Signing: ${APP}"
          codesign --force --deep --sign - "${APP}"
          codesign --verify --verbose=2 "${APP}" || true
          OUT_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          mkdir -p "${OUT_DIR}"
          ditto -c -k --sequesterRsrc --keepParent "${APP}" "${OUT_DIR}/Delegacje-PP-macos-arm64-unsigned.zip"
          ls -la "${OUT_DIR}"

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: warn
